<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Academy Ready</title>
<meta name="theme-color" content="#13223B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Academy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E8EDF1; --surface:#F8FAFB; --ink:#13223B; --muted:#56677C; --line:#C9D3DC;
  --brass:#A77A12; --brass-soft:#E9D9A8; --navy:#1E3A66;
  --low:#B8322A; --high:#B96A00; --ok:#2B7355;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1623; --surface:#172233; --ink:#E4EAF2; --muted:#93A3B7; --line:#27364C;
    --brass:#D9AE45; --brass-soft:#4A3C17; --navy:#9DB8E6; --low:#F07167; --high:#F2A541; --ok:#5CC49A;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1623; --surface:#172233; --ink:#E4EAF2; --muted:#93A3B7; --line:#27364C;
  --brass:#D9AE45; --brass-soft:#4A3C17; --navy:#9DB8E6; --low:#F07167; --high:#F2A541; --ok:#5CC49A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:18px 18px 110px}
header.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.brand{font:700 26px/1 var(--display);letter-spacing:.02em}
.brand span{color:var(--brass)}
.date{color:var(--muted);font-size:14px}
h2{font:700 30px/1.05 var(--display);margin:6px 0 14px}
h3{font:600 20px/1.2 var(--display);margin:0 0 8px;letter-spacing:.01em}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.panel.flat{background:transparent;border-style:dashed}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{appearance:none;border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.brass{background:var(--brass);color:#1a1300}
.btn.sm{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.big{font:700 44px/1 var(--display)}
.stat{font:600 28px/1 var(--display)}
.label{font-size:13px;color:var(--muted)}
/* hero badge */
.hero{display:grid;grid-template-columns:116px 1fr;gap:16px;align-items:center}
.shield{width:116px;height:auto;display:block}
.shield .fill{transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.shield .fill{transition:none}}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);border-radius:5px}
.bar.carb i{background:var(--navy)}
.ev{display:grid;grid-template-columns:64px 1fr 46px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.ev b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
/* lists */
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .x{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 6px;font-size:18px;line-height:1}
.gv{font:600 22px/1 var(--display);font-variant-numeric:tabular-nums}
.gv.low{color:var(--low)} .gv.high{color:var(--high)} .gv.in{color:var(--ok)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
/* sessions */
.sess{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.sess:first-of-type{border-top:0}
.check{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;margin-top:2px}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.sess.done .what{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.kind{font:600 17px/1.2 var(--display)}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.weeknav .btn{min-width:44px}
.week-strip{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin:10px 0 4px}
.week-strip i{height:18px;border-radius:3px;background:var(--line)}
.week-strip i.part{background:var(--brass-soft)}
.week-strip i.full{background:var(--brass)}
.week-strip i.cur{outline:2px solid var(--ink);outline-offset:1px}
/* chart */
.chart{width:100%;height:auto;display:block}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);border-top:0}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:transparent;padding:10px;border-radius:9px;font:600 17px/1 var(--display);cursor:pointer;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.q{font:600 24px/1.2 var(--display);margin:16px 0 14px}
.a{border-top:1px solid var(--line);padding-top:12px;font-size:16px}
.cite{font-size:13px;color:var(--brass);margin-top:8px;font-weight:600}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;list-style:none}
summary::-webkit-details-marker{display:none}
.gq{font-weight:600;margin:12px 0 2px}
.ga{font-size:14px;color:var(--muted)}
nav.tabs button{background:none;border:0;padding:10px 0 9px;cursor:pointer;color:var(--muted);font:600 13px/1 var(--display);letter-spacing:.03em;display:flex;flex-direction:column;align-items:center;gap:4px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{color:var(--brass)}
section[hidden]{display:none}
/* forms */
dialog{border:0;border-radius:18px 18px 0 0;padding:0;width:100%;max-width:640px;margin:auto auto 0;background:var(--surface);color:var(--ink);max-height:92%}
dialog::backdrop{background:rgba(8,14,24,.55)}
dialog form{padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
label.f{display:block;font-size:14px;font-weight:600;margin:12px 0 5px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
textarea{min-height:64px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;padding:7px 12px;border-radius:20px;border:1px solid var(--line);font-size:14px}
.chips input:checked+span{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips input:focus-visible+span{outline:3px solid var(--brass);outline-offset:2px}
.qa{display:flex;flex-wrap:wrap;gap:6px}
.qa button{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:6px 12px;font-size:14px;cursor:pointer}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.toast.show{opacity:1}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--brass);padding-left:10px;margin-top:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:12px;color:var(--muted);text-align:center}
.cal button{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 16px/1 var(--display);padding:0;color:var(--ink)}
.cal button small{font:500 9px/1 var(--body);color:var(--muted)}
.cal button.work{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cal button.work small{color:var(--paper);opacity:.75}
.cal button.today{outline:2px solid var(--brass);outline-offset:1px}
.cal button.past{opacity:.4}
.glasses{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 12px}
.glasses i{width:15px;height:24px;border:2px solid var(--navy);border-radius:2px 2px 6px 6px}
.glasses i.on{background:var(--navy)}
.rem{display:grid;grid-template-columns:134px 1fr 30px;gap:8px;align-items:center;margin:6px 0}
.rem .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:20px}
@media (max-width:380px){.hero{grid-template-columns:104px 1fr}.shield{width:104px}.big{font-size:38px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Academy <span>Ready</span></div>
    <div class="date" id="hdrDate"></div>
  </header>

  <section id="v-today"></section>
  <section id="v-train" hidden></section>
  <section id="v-sugar" hidden></section>
  <section id="v-food" hidden></section>
  <section id="v-study" hidden></section>
  <section id="v-more" hidden>
    <div class="seg" role="tablist"><button role="tab" data-sub="sched" aria-selected="true">Schedule</button><button role="tab" data-sub="goals" aria-selected="false">Goals & tests</button></div>
    <div id="v-sched"></div><div id="v-goals" hidden></div>
  </section>
</div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/></svg>Today</button>
  <button data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h2m12 0h2M6 8v8m12-8v8M8 10v4m8-4v4M8 12h8"/></svg>Train</button>
  <button data-tab="sugar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3s6 7 6 11a6 6 0 01-12 0c0-4 6-11 6-11z"/></svg>Sugar</button>
  <button data-tab="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3v8m-3-8v5a3 3 0 006 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/></svg>Food</button>
  <button data-tab="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM4 5v16M8 7h7"/></svg>Study</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4m8-4v4"/></svg>More</button>
</div></nav>

<dialog id="sheet"><form id="sheetForm" novalidate></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- plan ---------- */
const PLAN=[
{focus:"Build the habit",runs:["20 min: 8 × (1 min jog, 1½ min walk)","20 min: 8 × (1 min jog, 1½ min walk)","25 min brisk walk"],str:["Incline push-ups 3×6","Sit-ups 3×10","Squats 3×12","Plank 3×20s"]},
{focus:"Build the habit",runs:["22 min: 6 × (1½ min jog, 2 min walk)","22 min: 6 × (1½ min jog, 2 min walk)","30 min brisk walk"],str:["Incline push-ups 3×8","Sit-ups 3×12","Squats 3×15","Plank 3×25s"]},
{focus:"Longer jogs",runs:["24 min: 5 × (2 min jog, 2 min walk)","24 min: 5 × (2 min jog, 2 min walk)","25 min: 4 × (3 min jog, 2 min walk)"],str:["Incline push-ups 4×8","Sit-ups 3×15","Squats 3×15","Plank 3×30s"]},
{focus:"Check-in week",test:1,runs:["25 min: 4 × (3 min jog, 1½ min walk)","25 min: 4 × (3 min jog, 1½ min walk)","Check-in: 1 mile, best effort (walk if you need to)"],str:["Check-in: max push-ups in 1 min","Check-in: max sit-ups in 1 min","Squats 3×15","Plank 3×30s"]},
{focus:"Longer jogs",runs:["25 min: 3 × (5 min jog, 2 min walk)","25 min: 3 × (5 min jog, 2 min walk)","20 min: 8 × 20s stride, walk back"],str:["Push-ups 3×5, then incline 2×8","Sit-ups 4×15","Squats 4×15","Plank 3×35s"]},
{focus:"Longer jogs",runs:["26 min: 2 × (8 min jog, 2 min walk)","26 min: 2 × (8 min jog, 2 min walk)","6 × 30s fast, 90s walk between"],str:["Push-ups 4×6","Sit-ups 4×18","Lunges 3×10 each leg","Plank 3×40s"]},
{focus:"Run without stopping",runs:["20 min easy jog, no walking","20 min easy jog, no walking","8 × 30s fast, 90s walk between"],str:["Push-ups 4×8","Sit-ups 3×20","Squats 4×20","Plank 3×45s"]},
{focus:"Check-in week",test:1,runs:["22 min easy jog","22 min easy jog","Check-in: 1.5 miles for time"],str:["Check-in: max push-ups in 1 min","Check-in: max sit-ups in 1 min","Squats 4×20","Plank 3×45s"]},
{focus:"Add speed",runs:["25 min easy jog","25 min easy jog","6 × 200m fast, 2 min rest"],str:["Push-ups 5×8","Sit-ups 4×20","Jump squats 3×10","Plank 3×50s"]},
{focus:"Add speed",runs:["30 min easy jog","Tempo: 5 min easy, 12 min steady-hard, 5 min easy","4 × 300m hard, 3 min rest"],str:["Push-ups 5×10","Sit-ups 3×25","Jump squats 3×12","Plank 3×60s"]},
{focus:"Race pace",runs:["30 min easy jog","6 × 400m at goal 1.5-mile pace, 90s rest","5 × 300m hard, 3 min rest"],str:["Push-ups: 3 rounds of 1-min max","Sit-ups: 3 rounds of 1-min max","Lunges 3×12 each leg","Plank 3×60s"]},
{focus:"Check-in week",test:1,runs:["30 min easy jog","Tempo: 5 min easy, 15 min steady-hard, 5 min easy","Check-in: 1.5 miles, rest 5 min, then 300m sprint"],str:["Check-in: max push-ups in 1 min","Check-in: max sit-ups in 1 min","Jump squats 3×12","Plank 3×60s"]},
{focus:"Sharpen",runs:["35 min easy jog","8 × 400m at goal pace, 75s rest","6 × 300m hard, 3 min rest"],str:["Push-ups 5×12","Sit-ups 4×25","Jump squats 4×12","Plank 3×75s"]},
{focus:"Sharpen",runs:["35 min easy jog","Tempo: 5 min easy, 18 min steady-hard, 5 min easy","4 × 300m at test effort, full rest"],str:["Push-up ladder 1 → 8 → 1","Sit-ups 3×30","Lunges 4×12 each leg","Plank 3×90s"]},
{focus:"Taper",runs:["30 min easy jog","1 mile at goal pace, then 4 × 200m fast","3 × 300m at test effort, full rest"],str:["Push-ups: 3 rounds of 1-min max","Sit-ups: 3 rounds of 1-min max","Squats 3×20","Plank 3×60s"]},
{focus:"Mock test",test:1,runs:["20 min easy jog","15 min easy jog + 4 strides","Mock test: 1.5 miles, rest 5 min, then 300m sprint"],str:["Mock test: max push-ups in 1 min","Mock test: max sit-ups in 1 min","Rest or easy walk","Rest or easy walk"]}
];
const SESSIONS=[["r0","Run 1"],["r1","Run 2"],["r2","Run 3"],["s0","Strength 1"],["s1","Strength 2"]];
const EVENTS=[
 {k:"pushups",name:"Push-ups",unit:"in 1 min",lowerBetter:false},
 {k:"situps",name:"Sit-ups",unit:"in 1 min",lowerBetter:false},
 {k:"run15",name:"1.5 mi",unit:"time",lowerBetter:true,time:true},
 {k:"sprint300",name:"300 m",unit:"seconds",lowerBetter:true}
];
const GTAGS=[["fasting","Fasting"],["before","Before meal"],["after","After meal"],["pre","Before workout"],["post","After workout"],["bed","Bedtime"],["other","Other"]];
const MEALS=["Breakfast","Lunch","Dinner","Snack"];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey=()=>keyOf(new Date());
const nowTime=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const parseDate=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const fmtTime=s=>{if(!isFinite(s)||s<=0)return "—";return `${Math.floor(s/60)}:${pad(Math.round(s%60))}`};
const parseMMSS=v=>{v=String(v||"").trim();if(!v)return null;if(v.includes(":")){const [m,s]=v.split(":");return num(m)*60+num(s)}return num(v)*60};
const niceDate=k=>parseDate(k).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),1800)}

/* ---------- state + storage ---------- */
const DEFAULTS=()=>({startDate:todayKey(),unit:"mgdl",low:70,high:180,
  targets:{pushups:30,situps:35,run15:900,sprint300:65},
  macro:{calories:"",carbs:"",protein:""},done:{},tests:[],favorites:[],
  water:{goal:1893,unit:"oz"},
  sched:{mode:"weekly",anchor:todayKey(),pattern:[1,2,3,4,5],days:{},weeks:8,
    work:[{t:"05:00",what:"Fasting blood sugar"},{t:"10:00",what:"Drink water"},{t:"12:30",what:"Log lunch + blood sugar"},{t:"15:00",what:"Drink water"},{t:"18:30",what:"Workout (check sugar first)"},{t:"20:30",what:"Study cards (10 min)"},{t:"21:30",what:"Bedtime blood sugar"}],
    off:[{t:"08:30",what:"Fasting blood sugar"},{t:"11:00",what:"Workout (check sugar first)"},{t:"13:00",what:"Log lunch + blood sugar"},{t:"16:00",what:"Drink water"},{t:"19:00",what:"Study cards (10 min)"},{t:"22:00",what:"Bedtime blood sugar"}]},
  study:{cards:{},perDay:10,log:{}}});
let S={profile:DEFAULTS(),days:{}};
const LS="academy-ready-v1";
try{const c=JSON.parse(localStorage.getItem(LS)||"null");if(c&&c.profile){S=c;const D=DEFAULTS();S.profile={...D,...c.profile,water:{...D.water,...(c.profile.water||{})},sched:{...D.sched,...(c.profile.sched||{})},study:{...D.study,...(c.profile.study||{})}};S.days=S.days||{}}}catch(e){}
function cache(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast("Couldn't save — phone storage may be full")}}
function saveProfile(){cache()}
function day(k){const d=S.days[k]||(S.days[k]={date:k,glucose:[],food:[]});d.water=d.water||[];return d}
function saveDay(k){cache()}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- water ---------- */
const wUnit=()=>S.profile.water.unit;
const wDisp=ml=>wUnit()==="oz"?Math.round(ml/29.5735):Math.round(ml);
const wServ=()=>wUnit()==="oz"?[8,16,24]:[250,500,750];
const toMl=v=>wUnit()==="oz"?v*29.5735:v;
function waterPanel(k){const arr=S.days[k]?.water||[],tot=arr.reduce((a,b)=>a+b,0),goal=S.profile.water.goal,serv=toMl(wServ()[0]),n=Math.min(16,Math.ceil(goal/serv)),filled=Math.floor(tot/serv+0.01);
  return `<div class="panel"><div class="row between"><h3>Water</h3><span class="small muted">${wDisp(tot)} of ${wDisp(goal)} ${wUnit()}</span></div>
  <div class="glasses" aria-hidden="true">${Array.from({length:n},(_,i)=>`<i class="${i<filled?"on":""}"></i>`).join("")}</div>
  <div class="row" style="flex-wrap:wrap">${wServ().map(v=>`<button class="btn ghost sm" data-water="${k}|${v}">+${v} ${wUnit()}</button>`).join("")}${arr.length?`<button class="btn ghost sm" data-water-undo="${k}">Undo</button>`:""}</div></div>`}

/* ---------- schedule ---------- */

function glucoseChart(){
  const now=new Date(),start=new Date(now);start.setDate(start.getDate()-6);start.setHours(0,0,0,0);
  const pts=[];for(const k in S.days){const d=parseDate(k);if(d>=start)(S.days[k].glucose||[]).forEach(r=>{const [h,m]=(r.t||"0:0").split(":").map(Number);const ts=new Date(d);ts.setHours(h,m);pts.push({x:ts,v:r.v})})}
  const W=340,H=170,L=30,R=6,T=8,B=22,span=7*864e5;
  const maxV=Math.max(300,...pts.map(p=>p.v))+10,minV=40;
  const X=x=>L+(x-start)/span*(W-L-R),Y=v=>T+(1-(v-minV)/(maxV-minV))*(H-T-B);
  const ticks=[70,120,180,250].filter(v=>v<maxV);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Blood sugar over the last 7 days">`;
  s+=`<rect x="${L}" y="${Y(S.profile.high)}" width="${W-L-R}" height="${Y(S.profile.low)-Y(S.profile.high)}" fill="var(--ok)" opacity=".12"/>`;
  ticks.forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-4}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${gDisp(v)}</text>`});
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(d.getDate()+i);s+=`<text x="${X(d)+ (W-L-R)/14}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.toLocaleDateString(undefined,{weekday:"narrow"})}</text>`}
  const sorted=pts.sort((a,b)=>a.x-b.x);
  if(sorted.length>1)s+=`<polyline fill="none" stroke="var(--muted)" stroke-opacity=".5" stroke-width="1.5" points="${sorted.map(p=>`${X(p.x)},${Y(p.v)}`).join(" ")}"/>`;
  sorted.forEach(p=>{const c=gClass(p.v);s+=`<circle cx="${X(p.x)}" cy="${Y(p.v)}" r="4" fill="var(--${c==="in"?"ok":c})"/>`});
  return {svg:s+"</svg>",pts:sorted};
}

    <p class="small muted" style="margin:10px 0 0">Net carbs ${Math.round(t.carbs-t.fiber)} g · Fiber ${Math.round(t.fiber)} g · Sugar ${Math.round(t.sugar)} g · Fat ${Math.round(t.fat)} g</p>
  </div>
  ${waterPanel(k)}
  ${MEALS.map(meal=>{const list=items.filter(f=>f.meal===meal);if(!list.length)return "";const c=list.reduce((a,f)=>a+num(f.carbs),0);
    return `<div class="panel"><div class="row between"><h3>${meal}</h3><span class="small muted">${Math.round(c)} g carbs</span></div>
    ${list.map(f=>`<div class="item"><div><div>${esc(f.name)}</div><div class="small muted">${Math.round(num(f.carbs))} g carbs · ${Math.round(num(f.protein))} g protein · ${Math.round(num(f.calories))} cal</div></div><button class="x" data-del-f="${k}|${f.id}" aria-label="Delete ${esc(f.name)}">×</button></div>`).join("")}</div>`}).join("")}
  ${items.length?"":`<div class="panel flat"><p style="margin:0">Nothing logged for this day. Search common foods, or enter the numbers from the label.</p></div>`}`;
}
function renderGoals(){
  const P=S.profile,tests=[...P.tests].sort((a,b)=>a.date<b.date?1:-1);
  $("#v-goals").innerHTML=`
  <div class="row between"><h2>Goals & tests</h2><button class="btn brass" data-log-t>Record test</button></div>
  <div class="panel">
    <h3>Test history</h3>
    ${tests.length?`<div class="scroll"><table><thead><tr><th>Date</th>${EVENTS.map(e=>`<th>${e.name}</th>`).join("")}<th></th></tr></thead><tbody>
    ${tests.map(t=>`<tr><td>${esc(niceDate(t.date))}</td>${EVENTS.map(e=>`<td>${evVal(e,t[e.k]||null)}</td>`).join("")}<td><button class="x" data-del-t="${t.id}" aria-label="Delete test" style="background:none;border:0;color:var(--muted);cursor:pointer">×</button></td></tr>`).join("")}
    <tr><td><b>Target</b></td>${EVENTS.map(e=>`<td><b>${evVal(e,P.targets[e.k])}</b></td>`).join("")}<td></td></tr>
    </tbody></table></div>`:`<p class="small muted">No tests yet. Do a baseline now — however it goes, it's the number you'll beat. Check-in weeks (4, 8, 12, 16) remind you.</p>`}
  </div>
  <form class="panel" id="targetsForm">
    <h3>Test targets</h3>
    <p class="small muted">Defaults are common academy pass marks. Every department sets its own — swap in yours once you know them.</p>
    <div class="grid2">
      <div><label class="f">Push-ups (1 min)</label><input type="number" inputmode="numeric" name="pushups" value="${P.targets.pushups}"></div>
      <div><label class="f">Sit-ups (1 min)</label><input type="number" inputmode="numeric" name="situps" value="${P.targets.situps}"></div>
      <div><label class="f">1.5 mile (m:ss)</label><input type="text" inputmode="numeric" name="run15" value="${fmtTime(P.targets.run15)}"></div>
      <div><label class="f">300 m (seconds)</label><input type="number" inputmode="numeric" name="sprint300" value="${P.targets.sprint300}"></div>
    </div>
    <h3 style="margin-top:18px">Blood sugar</h3>
    <div class="chips" style="margin-bottom:4px">
      <label><input type="radio" name="unit" value="mgdl" ${!isMmol()?"checked":""}><span>mg/dL</span></label>
      <label><input type="radio" name="unit" value="mmol" ${isMmol()?"checked":""}><span>mmol/L</span></label>
    </div>
    <div class="grid2">
      <div><label class="f">Low line</label><input type="number" step="any" name="low" value="${gDisp(P.low)}"></div>
      <div><label class="f">High line</label><input type="number" step="any" name="high" value="${gDisp(P.high)}"></div>
    </div>
    <h3 style="margin-top:18px">Daily nutrition targets</h3>
    <p class="small muted">Optional. Leave blank to just see totals.</p>
    <div class="grid2" style="grid-template-columns:repeat(3,1fr)">
      <div><label class="f">Carbs (g)</label><input type="number" name="carbs" value="${P.macro.carbs}"></div>
      <div><label class="f">Protein (g)</label><input type="number" name="protein" value="${P.macro.protein}"></div>
      <div><label class="f">Calories</label><input type="number" name="calories" value="${P.macro.calories}"></div>
    </div>
    <h3 style="margin-top:18px">Water</h3>
    <div class="chips" style="margin-bottom:4px">
      <label><input type="radio" name="wunit" value="oz" ${wUnit()==="oz"?"checked":""}><span>oz</span></label>
      <label><input type="radio" name="wunit" value="ml" ${wUnit()==="ml"?"checked":""}><span>ml</span></label>
    </div>
    <label class="f">Daily goal (${wUnit()})</label><input type="number" name="wgoal" value="${wDisp(P.water.goal)}">
    <div class="actions"><button class="btn" type="submit">Save goals</button></div>
  </form>
  <div class="panel">
    <h3>Plan</h3>
    <p class="small">Started ${esc(niceDate(P.startDate))}. You're in week ${curWeek()} of 16.</p>
    <button class="btn ghost sm" id="restartBtn">Restart plan from this week</button>
  </div>
  <div class="panel">
    <h3>Backup</h3>
    <p class="small muted">Everything lives on this phone only — no account, no internet needed. Download a backup now and then so a phone swap or cleared browser can't wipe it.</p>
    <div class="row"><button class="btn ghost sm" data-backup>Download backup</button><label class="btn ghost sm">Restore backup<input type="file" accept="application/json,.json" id="restoreIn" hidden></label></div>
  </div>`;
  $("#targetsForm").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);
    const unit=f.get("unit");const conv=v=>unit==="mmol"?num(v)*18:num(v);
    P.targets={pushups:num(f.get("pushups")),situps:num(f.get("situps")),run15:parseMMSS(f.get("run15"))||P.targets.run15,sprint300:num(f.get("sprint300"))};
    const lo=conv(f.get("low")),hi=conv(f.get("high"));
    if(unit===P.unit){if(lo>0&&hi>lo){P.low=Math.round(lo);P.high=Math.round(hi)}}
    P.unit=unit;
    P.macro={carbs:f.get("carbs"),protein:f.get("protein"),calories:f.get("calories")};
    const wg=toMl(num(f.get("wgoal")));if(wg>0)P.water.goal=Math.round(wg);P.water.unit=f.get("wunit")||"oz";
    saveProfile();renderAll();toast("Goals saved")};
  $("#restartBtn").onclick=()=>{if(confirm("Restart the 16-week plan from today? Your test history and logs stay.")){P.startDate=todayKey();P.done={};viewWeek=null;saveProfile();renderAll();toast("Plan restarted")}};
}
function renderAll(){renderToday();renderTrain();renderSugar();renderFood();renderSched();renderGoals();if(!sess)renderStudy()}

/* ---------- sheets ---------- */
const sheet=$("#sheet"),sf=$("#sheetForm");
function openSheet(html,onSubmit,after){sf.innerHTML=html+`<div class="actions"><button type="button" class="btn ghost" id="cancelBtn">Cancel</button><button class="btn" type="submit">Save</button></div>`;
  sf.onsubmit=e=>{e.preventDefault();if(onSubmit(new FormData(sf))!==false)sheet.close()};
  $("#cancelBtn").onclick=()=>sheet.close();sheet.showModal();after&&after();}
sheet.addEventListener("click",e=>{if(e.target===sheet)sheet.close()});

function logGlucose(tag){
  openSheet(`<h3>Log blood sugar</h3>
  <label class="f" for="gv">Reading (${gUnit()})</label><input id="gv" type="number" inputmode="decimal" step="any" name="v" required autofocus>
  <label class="f">When</label><div class="chips">${GTAGS.map(([k,n])=>`<label><input type="radio" name="tag" value="${k}" ${k===(tag||"other")?"checked":""}><span>${n}</span></label>`).join("")}</div>
  <div class="grid2"><div><label class="f">Date</label><input type="date" name="d" value="${todayKey()}" max="${todayKey()}"></div><div><label class="f">Time</label><input type="time" name="t" value="${nowTime()}"></div></div>
  <label class="f">Note (optional)</label><input type="text" name="note" placeholder="Felt shaky, took insulin, etc.">`,f=>{
    const v=gIn(f.get("v"));if(!(v>10&&v<700)){toast("Enter a reading between "+(isMmol()?"1 and 38":"20 and 600"));return false}
    const k=f.get("d")||todayKey();day(k).glucose.push({id:uid(),t:f.get("t")||nowTime(),v:Math.round(v),tag:f.get("tag"),note:String(f.get("note")||"").slice(0,140)});
    saveDay(k);renderAll();toast(`Logged ${gDisp(v)} ${gUnit()}`)});
}
function guessMeal(){const h=new Date().getHours();return h<11?"Breakfast":h<15?"Lunch":h<20?"Dinner":"Snack"}
function logFood(){
  const favs=S.profile.favorites||[];
  openSheet(`<h3>Log food</h3>
  <div class="chips">${MEALS.map(m=>`<label><input type="radio" name="meal" value="${m}" ${m===guessMeal()?"checked":""}><span>${m}</span></label>`).join("")}</div>
  ${favs.length?`<label class="f">Quick add</label><div class="qa">${favs.map((f,i)=>`<button type="button" data-fav="${i}">${esc(f.name)}</button>`).join("")}</div>`:""}
  <label class="f" for="fs">Search common foods</label><input id="fs" type="text" placeholder="rice, banana, chicken…" autocomplete="off">
  <div class="qa" id="fsr" style="margin-top:6px"></div>
  <div style="display:grid;grid-template-columns:1fr 92px;gap:10px"><div><label class="f" for="fn">Food</label><input id="fn" type="text" name="name" required></div><div><label class="f" for="fsv">Servings</label><input id="fsv" type="number" step="any" inputmode="decimal" name="serv" value="1"></div></div>
  <div class="grid2" style="grid-template-columns:repeat(3,1fr)">
    <div><label class="f">Carbs g</label><input type="number" step="any" inputmode="decimal" name="carbs"></div>
    <div><label class="f">Fiber g</label><input type="number" step="any" inputmode="decimal" name="fiber"></div>
    <div><label class="f">Sugar g</label><input type="number" step="any" inputmode="decimal" name="sugar"></div>
    <div><label class="f">Protein g</label><input type="number" step="any" inputmode="decimal" name="protein"></div>
    <div><label class="f">Fat g</label><input type="number" step="any" inputmode="decimal" name="fat"></div>
    <div><label class="f">Calories</label><input type="number" step="any" inputmode="decimal" name="calories"></div>
  </div>
  <label class="row small" style="margin-top:12px;gap:8px"><input type="checkbox" name="fav"> Save to quick add</label>`,f=>{
    const name=String(f.get("name")||"").trim();if(!name){toast("Add a food name");return false}
    const k=foodDay||todayKey(),sv=num(f.get("serv"))||1,base={name:name.slice(0,80)},F=["carbs","fiber","sugar","protein","fat","calories"];
    F.forEach(x=>base[x]=num(f.get(x)));
    const item={id:uid(),meal:f.get("meal"),name:base.name+(sv!==1?` ×${sv}`:"")};
    F.forEach(x=>item[x]=Math.round(base[x]*sv*10)/10);
    day(k).food.push(item);saveDay(k);
    if(f.get("fav")&&!favs.some(x=>x.name===base.name)){S.profile.favorites=[base,...favs].slice(0,20);saveProfile()}
    renderAll();toast(`Logged ${item.name}`)},()=>{
    const set=o=>{for(const x in o){const el=sf.elements[x];if(el)el.value=o[x]}};
    sf.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>set(favs[+b.dataset.fav]));
    const fs=$("#fs"),fr=$("#fsr");fs.oninput=()=>{const q=fs.value.trim().toLowerCase();if(!q){fr.innerHTML="";return}
      const hits=FOODS.map((x,i)=>[x,i]).filter(([x])=>x[0].toLowerCase().includes(q)).slice(0,8);
      fr.innerHTML=hits.length?hits.map(([x,i])=>`<button type="button" data-lib="${i}">${esc(x[0])}</button>`).join(""):`<span class="small muted">No match. Enter it by hand below.</span>`;
      fr.querySelectorAll("[data-lib]").forEach(b=>b.onclick=()=>{const x=FOODS[+b.dataset.lib];set({name:x[0],calories:x[1],carbs:x[2],fiber:x[3],sugar:x[4],protein:x[5],fat:x[6]});fr.innerHTML="";fs.value=""})};
  });
}
function logTest(){
  openSheet(`<h3>Record test results</h3>
  <p class="small muted">Fill in whichever events you did.</p>
  <label class="f">Date</label><input type="date" name="d" value="${todayKey()}" max="${todayKey()}">
  <div class="grid2">
    <div><label class="f">Push-ups (1 min)</label><input type="number" inputmode="numeric" name="pushups"></div>
    <div><label class="f">Sit-ups (1 min)</label><input type="number" inputmode="numeric" name="situps"></div>
    <div><label class="f">1.5 mile (m:ss)</label><input type="text" inputmode="numeric" name="run15" placeholder="14:30"></div>
    <div><label class="f">300 m (seconds)</label><input type="number" inputmode="decimal" step="any" name="sprint300"></div>
  </div>`,f=>{
    const t={id:uid(),date:f.get("d")||todayKey(),pushups:num(f.get("pushups")),situps:num(f.get("situps")),run15:parseMMSS(f.get("run15"))||0,sprint300:num(f.get("sprint300"))};
    if(!t.pushups&&!t.situps&&!t.run15&&!t.sprint300){toast("Enter at least one result");return false}
    S.profile.tests.push(t);saveProfile();renderAll();toast("Test recorded")});
}

/* ---------- events ---------- */
let moreSub="sched";
function show(tab){if(tab==="sched"||tab==="goals"){moreSub=tab;tab="more"}
  document.querySelectorAll("nav.tabs button").forEach(b=>b.dataset.tab===tab?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  ["today","train","sugar","food","study","more"].forEach(t=>$("#v-"+t).hidden=t!==tab);
  $("#v-sched").hidden=moreSub!=="sched";$("#v-goals").hidden=moreSub!=="goals";
  document.querySelectorAll("[data-sub]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.sub===moreSub)));
  if(tab==="today")renderToday();window.scrollTo(0,0)}
document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)show(b.dataset.tab)});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-done],[data-log-g],[data-log-f],[data-log-t],[data-wk],[data-fd],[data-del-g],[data-del-f],[data-del-t],[data-water],[data-water-undo],[data-cal],[data-calm],[data-rem-add],[data-rem-del],[data-ics],[data-backup],[data-sub],[data-study-start],[data-study-show],[data-study-ans],[data-study-end],[data-study-home],[data-study-cat]");if(!t)return;
  const ds=t.dataset;
  if(ds.go)show(ds.go);
  else if(ds.done){const [w,k]=ds.done.split("|");const key=doneKey(w,k);if(S.profile.done[key])delete S.profile.done[key];else{S.profile.done[key]=todayKey();toast("Nice work. Logged.")}saveProfile();renderAll()}
  else if("logG" in ds)logGlucose(ds.logG);
  else if("logF" in ds)logFood();
  else if("logT" in ds)logTest();
  else if(ds.wk){viewWeek=Math.min(16,Math.max(1,viewWeek+ +ds.wk));renderTrain()}
  else if(ds.fd){foodDay=ds.fd===todayKey()?null:ds.fd;renderFood()}
  else if(ds.delG){const [k,id]=ds.delG.split("|");if(confirm("Delete this reading?")){day(k).glucose=day(k).glucose.filter(r=>r.id!==id);saveDay(k);renderAll()}}
  else if(ds.delF){const [k,id]=ds.delF.split("|");day(k).food=day(k).food.filter(r=>r.id!==id);saveDay(k);renderAll()}
  else if(ds.delT){if(confirm("Delete this test?")){S.profile.tests=S.profile.tests.filter(x=>x.id!==ds.delT);saveProfile();renderAll()}}
  else if(ds.water){const [k,v]=ds.water.split("|");day(k).water.push(Math.round(toMl(+v)));saveDay(k);renderAll();toast(`+${v} ${wUnit()}`)}
  else if(ds.waterUndo){day(ds.waterUndo).water.pop();saveDay(ds.waterUndo);renderAll()}
  else if(ds.cal){const k=ds.cal,sc=S.profile.sched,pat=baseType(k),nx=dayType(k)==="work"?"off":"work";if(nx===pat)delete sc.days[k];else sc.days[k]=nx;saveProfile();renderSched();renderToday()}
  else if(ds.calm){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+ +ds.calm,1);renderSched()}
  else if(ds.remAdd){S.profile.sched[ds.remAdd].push({t:"12:00",what:"Drink water"});S.profile.sched[ds.remAdd].sort((a,b)=>a.t<b.t?-1:1);saveProfile();renderSched();renderToday()}
  else if(ds.remDel){const [type,i]=ds.remDel.split("|");S.profile.sched[type].splice(+i,1);saveProfile();renderSched();renderToday()}
  else if("ics" in ds)exportIcs();
  else if(ds.sub)show(ds.sub);
  else if("studyStart" in ds){const {due,fresh}=todaysCards();startSession([...due,...fresh],"Today's cards")}
  else if("studyShow" in ds){sess.shown=true;renderStudy()}
  else if(ds.studyAns!=null)answer(ds.studyAns==="1");
  else if("studyEnd" in ds){sess=null;renderStudy()}
  else if("studyHome" in ds)renderStudy();
  else if(ds.studyCat)startSession(DECK.filter(c=>c[1]===ds.studyCat).map(c=>c[0]),ds.studyCat);
  else if("backup" in ds){downloadBlob(new Blob([JSON.stringify(S)],{type:"application/json"}),`academy-ready-backup-${todayKey()}.json`);toast("Backup downloaded")}
});

$("#hdrDate").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
document.addEventListener("change",e=>{const t=e.target,ds=t.dataset||{};
  if(ds.rem){const [type,i,f]=ds.rem.split("|"),r=S.profile.sched[type][+i];if(!r)return;r[f]=String(t.value).slice(0,60);if(f==="t")S.profile.sched[type].sort((a,b)=>a.t<b.t?-1:1);saveProfile();renderSched();renderToday()}
  else if(ds.pat!=null){const d=+ds.pat,p=S.profile.sched.pattern;S.profile.sched.pattern=t.checked?[...new Set([...p,d])]:p.filter(x=>x!==d);saveProfile();renderSched();renderToday()}
  else if("weeks" in ds){S.profile.sched.weeks=+t.value;saveProfile()}
  else if(ds.mode){S.profile.sched.mode=ds.mode;S.profile.sched.days={};saveProfile();renderSched();renderToday()}
  else if("anchor" in ds&&t.value){S.profile.sched.anchor=t.value;S.profile.sched.days={};saveProfile();renderSched();renderToday()}
  else if("perday" in ds){S.profile.study.perDay=+t.value;saveProfile();renderStudy();renderToday()}
  else if(t.id==="restoreIn"&&t.files[0]){const rd=new FileReader();rd.onload=()=>{try{const c=JSON.parse(rd.result);if(!c.profile||!c.days)throw 0;
      if(confirm("Replace everything in the app with this backup?")){const D=DEFAULTS();S={profile:{...D,...c.profile,water:{...D.water,...(c.profile.water||{})},sched:{...D.sched,...(c.profile.sched||{})},study:{...D.study,...(c.profile.study||{})}},days:c.days};cache();renderAll();toast("Backup restored")}}
    catch(err){toast("That file isn't an Academy Ready backup")}t.value=""};rd.readAsText(t.files[0])}
});
renderAll();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
